# main에 올릴 때마다 Mac에서 앱을 빌드해 Releases에 올립니다.
#  - main 푸시      → "latest" 릴리스를 최신 빌드로 교체
#  - v* 태그 푸시   → 그 버전 이름으로 릴리스 생성 (예: git tag v1.2 && git push origin v1.2)
#  - Actions 탭에서 수동 실행도 가능
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 버전 정하기
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: 앱 빌드 (Apple Silicon + Intel)
        run: UNIVERSAL=1 bash build.sh

      - name: 확인
        run: |
          lipo -info build/MenuCycle.app/Contents/MacOS/MenuCycle
          codesign --verify --verbose build/MenuCycle.app

      - name: DMG · zip 만들기
        run: |
          mkdir -p dist/dmg
          cp -R build/MenuCycle.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "MenuCycle" -srcfolder dist/dmg -ov -format UDZO dist/MenuCycle.dmg
          ditto -c -k --keepParent build/MenuCycle.app dist/MenuCycle-app.zip
          rm -rf dist/dmg
          ls -la dist

      - name: 릴리스 노트
        run: |
          cat > notes.md <<EOF
          **설치**: \`MenuCycle.dmg\`를 열고 MenuCycle을 Applications 폴더로 끌어다 놓으세요. (macOS 13 이상, Apple Silicon·Intel 모두 지원)

          **처음 열 때 "확인되지 않은 개발자" 경고가 뜨면**: 시스템 설정 → 개인정보 보호 및 보안 → 아래쪽 **그래도 열기**를 누르세요.
          또는 터미널에서 \`xattr -cr /Applications/MenuCycle.app\` 실행 후 다시 여세요.

          빌드: ${VERSION} (커밋 ${GITHUB_SHA::7})
          EOF

      - name: latest 릴리스 갱신 (main)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/MenuCycle.dmg dist/MenuCycle-app.zip \
            --target "$GITHUB_SHA" \
            --title "MenuCycle 최신 빌드 (${VERSION})" \
            --notes-file notes.md \
            --latest

      - name: 버전 릴리스 (태그)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/MenuCycle.dmg dist/MenuCycle-app.zip \
            --title "MenuCycle ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes
